[project]
name = "fimserve"
version = "0.2.13"
description = "Framework which is developed with the purpose of quickly generating Flood Inundation Maps (FIM) for emergency response and risk assessment. It is developed under Surface Dynamics Modeling Lab (SDML)."
authors = [
    { name = "Surface Dynamics Modeling Lab (SDML)" },
    { name = "Supath Dhital", email = "sdhital@crimson.ua.edu" }
    ]
maintainers = [{ name = "Supath Dhital", email = "sdhital@crimson.ua.edu" }]
license = { text = "GPL-3.0" }
readme = "README.md"
# Upper bound tracks teehr, which supports <3.14. Colab runs 3.13.
requires-python = ">=3.10,<3.14"
# Floors are the oldest release that actually works, not the newest available.
# Raising them forces hosted notebooks (Colab) to swap out preinstalled binary
# packages, which breaks the already-imported numpy/pyarrow ABI in a live kernel.
dependencies = [
    "teehr==0.6.6",
    "geemap>=0.37.2",
    # pyarrow <21 and netcdf4 ==1.7.2 are imposed by teehr.
    "pyarrow>=15,<21",
    "netcdf4>=1.7.2",
    "numpy>=2.1",
    "scipy>=1.11",
    "geopandas>=1.0.1",
    "geocube<=0.7.1",
    "fiona>=1.10.1",
    "matplotlib>=3.7",
    "awscli>=1.32",
    "boto3>=1.34",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "fimeval>=0.1.65",
    # teehr pulls numba, which pulls llvmlite. llvmlite stopped publishing macOS
    # x86_64 wheels at 0.46, so on Intel Macs anything newer falls back to a
    # source build that needs CMake. numba <0.63 pins llvmlite to 0.45, the last
    # release with an x86_64 wheel. Every other platform is left unconstrained.
    "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# Only for a local Jupyter setup. Never install these on Colab/Binder: replacing
# ipykernel/notebook under a live kernel is what breaks `import fimserve` there.
notebook = [
    "jupyter>=1.1.1",
    "notebook>=7.6.1",
    "ipykernel>=7.3.0",
    "localtileserver>=1.0.0",
]

dev = [
    "pytest>=9.1.1",
    # sphinx >=8 needs docutils >=0.20, but awscli 1.x pins docutils <=0.19.
    "sphinx>=7.3.7,<7.4",
    "sphinx-autobuild>=2024.10.3",
    "ruff>=0.16.2"
]

# Install with: pip install "fimserve[sm]"
# This pulls in PyTorch and SM-enhancement runtime dependencies.
sm = [
    "pytorch-lightning>=2.6.5,<3",
    "torchmetrics>=1.9.0,<2",
]

[tool.uv]
override-dependencies = ["pyiceberg>=0.10.0,<0.11.0"]

[project.urls]
Homepage = "https://github.com/sdmlua/FIMserv"
Repository = "https://github.com/sdmlua/FIMserv"
Issues = "https://github.com/sdmlua/FIMserv/issues"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["docs", "GeoGLOWS", "*.ipynb"]

[tool.ruff.lint]
# E402/F403/F405: module-level star imports and late imports are part of the
# package's existing style. F841 fixes are unsafe and left for manual cleanup.
ignore = ["E402", "F403", "F405", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
